name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0" "ndk;26.1.10909125" "cmake;3.22.1"

      - name: Install npm dependencies
        # package-lock.json из исходников повреждён (Invalid Version), ставим без него
        run: |
          rm -f package-lock.json
          npm install --legacy-peer-deps --no-audit --no-fund

      - name: Expo prebuild (android)
        run: CI=1 npx expo prebuild -p android --clean --no-install

      - name: Install persistent debug keystore
        # Единый ключ подписи для всех сборок — иначе каждая сборка подписывается
        # новым случайным ключом и APK не ставятся поверх друг друга.
        run: |
          mkdir -p ~/.android
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > ~/.android/debug.keystore

      - name: Build release APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon --max-workers=2

      - name: List APK outputs
        run: find android -name "*.apk" -type f

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: study-motivator-release-apk
          path: android/app/build/outputs/apk/**/*.apk
